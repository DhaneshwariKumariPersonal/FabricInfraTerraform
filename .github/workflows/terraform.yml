# Terraform CI/CD for the Fabric CI/CD lab (GitHub Actions Edition)
#
# Converted from Azure DevOps to GitHub Actions
# Runs in GitHub Actions and authenticates to Azure (state backend storage account,
# ARM/azapi, Entra ID and Microsoft Fabric) with a single Entra ID service
# principal. Every value the Terraform configuration needs - backend storage
# config and all root-module input variables - is supplied from GitHub Secrets
# and Variables.
#
# Secrets MUST live in GitHub Secrets (they are encrypted); they are
# NOT committed here. Create these secrets:
#   TENANT_ID, SUBSCRIPTION_ID, CLIENT_ID, CLIENT_SECRET, ENTERPRISE_OBJECT_ID
#
# Non-secret values live in GitHub Variables:
#   BACKEND_RESOURCE_GROUP, BACKEND_STORAGE_ACCOUNT, BACKEND_CONTAINER, BACKEND_KEY,
#   RESOURCE_GROUP_NAME, CAPACITY_NAME, LOCATION, FABRIC_TIER,
#   WORKSPACE_NAME_PREFIX, CAPACITY_ADMINISTRATORS, WORKSPACE_ADMINS
#
# Each terraform step is executed via ./.github/actions/terraform-step action so
# the ARM_* / TF_VAR_* env block is defined exactly once at workflow level.

name: Terraform Deploy to Fabric

# Trigger: Push to main or manual trigger
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Environment variables - defined once at workflow level for all jobs
# Maps to Azure DevOps variable groups:
#   Fabric_Deployment_Group_S (secrets) → GitHub Secrets
#   Fabric_Deployment_Group_NS (variables) → GitHub Variables
env:
  TERRAFORM_VERSION: '1.15.6'
  TF_IN_AUTOMATION: 'true'

  # ---- Backend config (from GitHub Variables) ----
  BACKEND_RESOURCE_GROUP: ${{ vars.BACKEND_RESOURCE_GROUP }}
  BACKEND_STORAGE_ACCOUNT: ${{ vars.BACKEND_STORAGE_ACCOUNT }}
  BACKEND_CONTAINER: ${{ vars.BACKEND_CONTAINER }}
  BACKEND_KEY: ${{ vars.BACKEND_KEY }}

  # ---- Service principal auth for Azure (ARM/azapi) ----
  ARM_USE_AZUREAD: 'true'
  ARM_TENANT_ID: ${{ secrets.TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
  ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

  # ---- Service principal auth for Microsoft Fabric ----
  FABRIC_TENANT_ID: ${{ secrets.TENANT_ID }}
  FABRIC_CLIENT_ID: ${{ secrets.CLIENT_ID }}
  FABRIC_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

  # ---- Terraform input variables (from GitHub Variables + Secrets) ----
  TF_VAR_tenant_id: ${{ secrets.TENANT_ID }}
  TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
  TF_VAR_client_id: ${{ secrets.CLIENT_ID }}
  TF_VAR_client_secret: ${{ secrets.CLIENT_SECRET }}
  TF_VAR_enterprise_object_id: ${{ secrets.ENTERPRISE_OBJECT_ID }}
  TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
  TF_VAR_capacity_name: ${{ vars.CAPACITY_NAME }}
  TF_VAR_location: ${{ vars.LOCATION }}
  TF_VAR_fabric_tier: ${{ vars.FABRIC_TIER }}
  TF_VAR_workspace_name_prefix: ${{ vars.WORKSPACE_NAME_PREFIX }}
  TF_VAR_capacity_administrators: ${{ vars.CAPACITY_ADMINISTRATORS }}
  TF_VAR_workspace_admins: ${{ vars.WORKSPACE_ADMINS }}
  TF_VAR_connection_name: ${{ vars.CONNECTION_NAME }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}

# ============================================================================
# STAGE 1: VALIDATE (Terraform fmt + validate)
# ============================================================================
jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform fmt and validate
        uses: ./.github/actions/terraform-step
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          script: |
            terraform fmt -check -recursive
            terraform validate

# ============================================================================
# STAGE 2: PLAN (Terraform plan + artifacts)
# ============================================================================
  plan:
    name: Plan Terraform
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Terraform plan
        uses: ./.github/actions/terraform-step
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          script: |
            terraform plan -input=false -lock-timeout=300s -out=tfplan
            terraform show -no-color tfplan > tfplan.txt

      - name: Publish Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 5

# ============================================================================
# STAGE 3: APPLY (Terraform apply - only on main branch push)
# ============================================================================
  apply:
    name: Apply Terraform to production
    runs-on: ubuntu-latest
    needs: plan
    # Only run Apply when:
    # 1. On push to main branch (like Azure DevOps condition)
    # 2. Previous jobs succeeded
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: fabric

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Terraform apply
        uses: ./.github/actions/terraform-step
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          script: |
            terraform apply -input=false -lock-timeout=300s tfplan
